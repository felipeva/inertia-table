name: Publish Package to npmjs
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10
      - run: npm install -g npm@^11.5.1
      - name: Verify tag == package.json version and pick dist-tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NAME=$(node -p "require('./package.json').name")
          PKG=$(node -p "require('./package.json').version")
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != package.json $PKG"; exit 1; }
          if [[ "$PKG" == *-* ]]; then
            DIST=next
          else
            LATEST=$(npm view "$NAME" dist-tags.latest)
            [ -n "$LATEST" ] || { echo "::error::could not read the latest dist-tag of $NAME"; exit 1; }
            TOP=$(printf '%s\n%s\n' "$LATEST" "$PKG" | sort -V | tail -1)
            if [ "$TOP" = "$PKG" ]; then DIST=latest; else DIST="v${PKG%%.*}-lts"; fi
          fi
          echo "dist=$DIST" >> "$GITHUB_OUTPUT"
      - run: yarn install --immutable
      - run: yarn build
      # npm tries OIDC first and falls back to NODE_AUTH_TOKEN when no trusted publisher is configured
      - run: npm publish --access public --tag "${{ steps.meta.outputs.dist }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
